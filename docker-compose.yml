services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5444:5432"
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
    volumes:
      # 18+ images store data in a major-version subdirectory (…/18/docker), so the mount goes
      # one level up — mounting /var/lib/postgresql/data makes the container refuse to start.
      - pgdata:/var/lib/postgresql

  meilisearch:
    image: getmeili/meilisearch:v1.13
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: lifeos-dev-key
      MEILI_ENV: development
    volumes:
      - msdata:/meili_data

volumes:
  pgdata:
  msdata:
